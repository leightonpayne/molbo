[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "molbo"
version = "0.1.2"
description = "Inspect PDB/CIF molecular structures from the command line"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "molbo contributors" }]
keywords = ["molecular", "structure", "pdb", "cif", "molstar", "viewer", "cli", "molbo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.urls]
Documentation = "https://leightonpayne.github.io/molbo/"
Issues = "https://github.com/leightonpayne/molbo/issues"
Repository = "https://github.com/leightonpayne/molbo"

[project.scripts]
molbo = "molbo.cli:app"

[tool.hatch.build]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
]

[tool.hatch.build.targets.wheel]
packages = ["src/molbo"]
include = [
    "src/molbo/viewer.html",
    "src/molbo/vendor/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "flexoki-zensical>=0.1.0",
    "pymdown-extensions>=10.21.2",
    "ruff>=0.9.0",
    "zensical>=0.0.43",
]
