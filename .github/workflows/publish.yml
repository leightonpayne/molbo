name: Publish to PyPI

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Run tests
        run: uv run python -m unittest discover -s tests -v

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: uv run python -c "import os, molbo; expected = f'v{molbo.__version__}'; actual = os.environ['GITHUB_REF_NAME']; assert actual == expected, f'release tag {actual!r} does not match {expected!r}'"

      - name: Build distributions
        run: uv build

      - name: Install wheel in clean environment
        run: |
          uv venv /tmp/molbo-wheel-smoke --python 3.12
          uv pip install --python /tmp/molbo-wheel-smoke/bin/python dist/*.whl

      - name: Smoke-test installed wheel
        run: |
          /tmp/molbo-wheel-smoke/bin/molbo --version
          /tmp/molbo-wheel-smoke/bin/python -c "from importlib.resources import files; pkg = files('molbo'); required = ['py.typed', 'viewer.html', 'vendor/molstar-4.5.0.css', 'vendor/molstar-4.5.0.js', 'vendor/qrcode-generator-2.0.4.min.js', 'vendor/LICENSE-molstar', 'vendor/LICENSE-qrcode-generator']; missing = [p for p in required if not pkg.joinpath(p).is_file()]; assert not missing, f'missing packaged files: {missing}'"
          /tmp/molbo-wheel-smoke/bin/python -c "from importlib.metadata import requires; assert not any('zensical' in dependency for dependency in requires('molbo') or [])"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
