<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title_html }} - Molbo</title>
    <link rel="icon" type="image/svg+xml" href="{{ favicon_url_html }}" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #fcfbf9;
            --surface: #dcd8cf;
            --border: #c8c1b2;
            --text: #1c1917;
            --text-dim: #5c4631;
            --accent: #6e5237;
            --accent-glow: #fcfbf9;
            --error: #b91c1c;
            --live: #15803d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-width: 0;
            padding: 8px 16px;
            padding-top: max(8px, env(safe-area-inset-top));
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            z-index: 10;
            flex-shrink: 0;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.5px;
            color: var(--accent);
        }

        .filename {
            font-size: 13px;
            color: var(--text-dim);
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            background: var(--bg);
            padding: 3px 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
            min-width: 0;
            max-width: 480px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            gap: 8px;
        }

        .icon-button {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .icon-button:hover {
            background: var(--accent-glow);
            border-color: var(--accent);
        }

        .icon-button:focus-visible,
        .qr-copy-button:focus-visible,
        .qr-close-button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .icon-button svg {
            width: 16px;
            height: 16px;
        }

        .icon-button.spinning svg {
            animation: spin 0.7s linear infinite;
        }

        .watch-dot {
            display: none;
            position: absolute;
            top: 3px;
            right: 3px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--live);
        }

        .watch-dot.active {
            display: block;
        }

        #app-container {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        #viewer {
            position: absolute;
            inset: 0;
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            background: var(--bg);
            z-index: 5;
            transition: opacity 0.4s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 13px;
            color: var(--text-dim);
        }

        .error-box {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            padding: 24px;
            background: var(--bg);
            z-index: 6;
        }

        .error-box.visible {
            display: flex;
        }

        .error-icon {
            font-size: 36px;
            color: var(--error);
        }

        .error-msg {
            font-size: 14px;
            color: var(--error);
            max-width: 500px;
            text-align: center;
            line-height: 1.5;
        }

        .qr-modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0, 0, 0, 0.45);
            z-index: 20;
        }

        .qr-modal.visible {
            display: flex;
        }

        .qr-card {
            width: min(92vw, 340px);
            padding: 16px;
            border-radius: 14px;
            background: #ffffff;
            color: var(--text);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .qr-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .qr-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .qr-close-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text-dim);
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
        }

        .qr-close-button:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        .qr-box {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
        }

        #qr-code canvas,
        #qr-code img {
            display: block;
            width: min(72vw, 240px);
            height: auto;
        }

        .qr-fallback {
            font-size: 12px;
            color: var(--text-dim);
            text-align: center;
            padding: 16px 8px;
        }

        .qr-url-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .qr-url {
            flex: 1;
            min-width: 0;
            font-size: 12px;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .qr-copy-button {
            flex-shrink: 0;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--accent);
            cursor: pointer;
        }

        .qr-copy-button:hover {
            border-color: var(--accent);
        }

        .qr-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-dim);
            cursor: pointer;
            user-select: none;
        }

        .qr-toggle input {
            accent-color: var(--accent);
            cursor: pointer;
        }

        .qr-note {
            display: none;
            font-size: 12px;
            line-height: 1.4;
            color: var(--text-dim);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
        }

        .qr-note.visible {
            display: block;
        }

        @media (max-width: 768px) {
            .topbar {
                padding-left: 12px;
                padding-right: 12px;
            }

            .topbar-left {
                gap: 8px;
            }

            .logo {
                font-size: 15px;
            }

            .filename {
                font-size: 12px;
                padding: 3px 8px;
            }

            .icon-button {
                width: 28px;
                height: 28px;
            }
        }
    </style>
    <link rel="stylesheet" href="{{ molstar_css_url_html }}" />
</head>
<body>
    <div class="topbar">
        <div class="topbar-left">
            <span class="logo">
                <svg viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;margin-right:4px;">
                    <circle cx="12" cy="12" r="2.3" fill="currentColor"></circle>
                    <ellipse cx="12" cy="12" rx="9" ry="3.8" fill="none" stroke="currentColor" stroke-width="1.4"></ellipse>
                    <ellipse cx="12" cy="12" rx="9" ry="3.8" fill="none" stroke="currentColor" stroke-width="1.4" transform="rotate(60 12 12)"></ellipse>
                    <ellipse cx="12" cy="12" rx="9" ry="3.8" fill="none" stroke="currentColor" stroke-width="1.4" transform="rotate(120 12 12)"></ellipse>
                </svg>MOLBO
            </span>
            <span class="filename" title="{{ filename_html }}">{{ filename_html }}</span>
        </div>
        <div class="topbar-right">
            <button
                class="icon-button"
                id="reload-button"
                type="button"
                aria-label="Reload structure"
                title="Reload structure"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                    <polyline points="21 3 21 9 15 9" />
                </svg>
                <span class="watch-dot" id="watch-dot" aria-hidden="true"></span>
            </button>
            <a
                class="icon-button"
                id="download-button"
                href="{{ file_url_html }}"
                download="{{ download_filename_html }}"
                aria-label="Download structure"
                title="Download structure"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
            </a>
            <button
                class="icon-button"
                id="qr-button"
                type="button"
                aria-label="Show share QR code"
                title="Share session"
                aria-haspopup="dialog"
                aria-controls="qr-modal"
                aria-expanded="false"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M3 3h8v8H3V3Zm2 2v4h4V5H5Zm8-2h8v8h-8V3Zm2 2v4h4V5h-4ZM3 13h8v8H3v-8Zm2 2v4h4v-4H5Zm8-2h2v2h-2v-2Zm4 0h2v2h-2v-2Zm-2 2h2v2h-2v-2Zm-2 2h2v2h-2v-2Zm4 0h4v4h-2v-2h-2v-2Zm-2 2h2v2h-2v-2Zm-2 2h2v2h-2v-2Z"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="app-container">
        <div class="loading-overlay" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Loading structure…</div>
        </div>
        <div class="error-box" id="error" role="alert">
            <div class="error-icon" aria-hidden="true">⚠</div>
            <div class="error-msg" id="error-msg"></div>
        </div>
        <div id="viewer"></div>
    </div>

    <div class="qr-modal" id="qr-modal" aria-hidden="true">
        <div class="qr-card" role="dialog" aria-modal="true" aria-labelledby="qr-title">
            <div class="qr-header">
                <span class="qr-title" id="qr-title">Share session</span>
                <button class="qr-close-button" id="qr-close" type="button" aria-label="Close share dialog">&times;</button>
            </div>
            <div class="qr-box">
                <div id="qr-code" aria-label="QR code"></div>
            </div>
            <div class="qr-url-row">
                <input class="qr-url" id="qr-url" type="text" readonly aria-label="Share URL" />
                <button class="qr-copy-button" id="qr-copy" type="button">Copy</button>
            </div>
            <label class="qr-toggle">
                <input type="checkbox" id="qr-include-view" />
                <span>Include current camera view</span>
            </label>
            <div class="qr-note" id="qr-note"></div>
        </div>
    </div>

    <script src="{{ molstar_js_url_html }}"></script>
    <script src="{{ qrcode_js_url_html }}"></script>
    <script>
        var FORMAT_MAP = {
            'pdb':   'pdb',
            'cif':   'mmcif',
            'mmcif': 'mmcif',
            'bcif':  'mmcif',
            'pdbqt': 'pdbqt',
            'sdf':   'sdf',
            'mol':   'mol',
            'mol2':  'mol2',
            'xyz':   'xyz',
            'gro':   'gro',
        };
        var STRUCTURE_NAME = {{ structure_name_json }};
        var FILE_URL = {{ file_url_json }};
        var FORMAT_KEY = {{ format_json }};
        var AUTO_CLOSE = {{ auto_close_json }};
        var EXPLICIT_SHARE_URL = {{ share_url_json }};
        var FALLBACK_SHARE_URL = {{ fallback_share_url_json }};
        var HEARTBEAT_URL = {{ heartbeat_url_json }};
        var BYE_URL = {{ bye_url_json }};
        var HEARTBEAT_INTERVAL_MS = {{ heartbeat_interval_ms_json }};
        var WATCH_ENABLED = {{ watch_json }};
        var VERSION_URL = {{ version_url_json }};
        var activeViewer = null;
        var reloadInFlight = false;
        var pendingReload = false;
        var pendingForceRefresh = false;
        var readyResolve = null;
        var readyReject = null;
        var readyPromise = new Promise(function (resolve, reject) {
            readyResolve = resolve;
            readyReject = reject;
        });
        readyPromise.catch(function () {});

        function createClientId() {
            if (window.crypto && typeof window.crypto.randomUUID === 'function') {
                return window.crypto.randomUUID();
            }
            return 'client-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        }

        function withQueryParam(url, key, value) {
            var separator = url.indexOf('?') === -1 ? '?' : '&';
            return url + separator + encodeURIComponent(key) + '=' + encodeURIComponent(value);
        }

        function isLoopbackUrl(rawUrl) {
            try {
                var hostname = new URL(rawUrl, window.location.href).hostname.replace(/^\[|\]$/g, '');
                return hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '::1';
            } catch (_err) {
                return false;
            }
        }

        function roundNum(value, decimals) {
            var factor = Math.pow(10, decimals);
            return Math.round(value * factor) / factor;
        }

        function encodeCameraHash(snapshot) {
            if (!snapshot || !snapshot.position || !snapshot.target || !snapshot.up) {
                return '';
            }
            var mode = snapshot.mode === 'orthographic' ? 'o' : 'p';
            var parts = [
                mode,
                roundNum(snapshot.position[0], 3),
                roundNum(snapshot.position[1], 3),
                roundNum(snapshot.position[2], 3),
                roundNum(snapshot.target[0], 3),
                roundNum(snapshot.target[1], 3),
                roundNum(snapshot.target[2], 3),
                roundNum(snapshot.up[0], 4),
                roundNum(snapshot.up[1], 4),
                roundNum(snapshot.up[2], 4),
                roundNum(snapshot.fov, 4),
                roundNum(snapshot.radius, 3),
            ];
            return '#cam=' + parts.join(',');
        }

        function decodeCameraHash(hash) {
            if (!hash || hash.indexOf('#cam=') !== 0) {
                return null;
            }
            var parts = hash.slice(5).split(',');
            if (parts.length !== 12) {
                return null;
            }
            var mode = parts[0] === 'o' ? 'orthographic' : (parts[0] === 'p' ? 'perspective' : null);
            if (!mode) {
                return null;
            }
            var nums = [];
            for (var i = 1; i < parts.length; i++) {
                var value = Number(parts[i]);
                if (!Number.isFinite(value)) {
                    return null;
                }
                nums.push(value);
            }
            return {
                mode: mode,
                position: [nums[0], nums[1], nums[2]],
                target: [nums[3], nums[4], nums[5]],
                up: [nums[6], nums[7], nums[8]],
                fov: nums[9],
                radius: nums[10],
            };
        }

        function applyCameraFromHash(viewer) {
            var snapshot = decodeCameraHash(window.location.hash);
            if (snapshot && viewer && viewer.plugin.canvas3d) {
                viewer.plugin.canvas3d.camera.setState(snapshot, 0);
            }
        }

        function currentBaseShareUrl() {
            if (EXPLICIT_SHARE_URL) {
                return EXPLICIT_SHARE_URL;
            }
            var pageHref = window.location.href.split('#')[0];
            if (isLoopbackUrl(pageHref) && FALLBACK_SHARE_URL) {
                return FALLBACK_SHARE_URL;
            }
            return pageHref;
        }

        function currentShareUrl() {
            var base = currentBaseShareUrl();
            var includeView = document.getElementById('qr-include-view');
            if (includeView && includeView.checked && activeViewer && activeViewer.plugin.canvas3d) {
                var hash = encodeCameraHash(activeViewer.plugin.canvas3d.camera.getSnapshot());
                if (hash) {
                    return base.split('#')[0] + hash;
                }
            }
            return base;
        }

        function applyPublicationLook(viewer) {
            var canvas = viewer.plugin.canvas3d;
            if (!canvas) {
                return;
            }

            canvas.setProps({
                postprocessing: {
                    occlusion: { name: 'on', params: {
                        multiScale: { name: 'off', params: {} },
                        radius: 5, bias: 0.8, blurKernelSize: 15,
                        resolutionScale: 1, samples: 32,
                        color: 0x000000
                    }},
                    outline: { name: 'on', params: {
                        scale: 1, threshold: 0.33,
                        color: 0x000000, includeTransparent: true
                    }}
                },
                renderer: {
                    ambientIntensity: 1.0,
                    light: [
                        { inclination: 180, azimuth: 0, color: 0xffffff, intensity: 0.0 }
                    ]
                },
            });
        }

        function renderQrCode(shareUrl) {
            var qrTarget = document.getElementById('qr-code');
            if (!qrTarget) {
                return;
            }
            if (typeof qrcode !== 'function') {
                qrTarget.innerHTML = '<p class="qr-fallback">QR generator unavailable.</p>';
                return;
            }
            try {
                var qr = qrcode(0, 'M');
                qr.addData(shareUrl);
                qr.make();
                qrTarget.innerHTML = qr.createImgTag(6, 16, 'Share QR code');
            } catch (_err) {
                qrTarget.innerHTML = '<p class="qr-fallback">URL is too long to encode as a QR code.</p>';
            }
        }

        function updateQrModalContent() {
            var shareUrl = currentShareUrl();
            var qrUrl = document.getElementById('qr-url');
            var qrNote = document.getElementById('qr-note');
            renderQrCode(shareUrl);
            if (qrUrl) {
                qrUrl.value = shareUrl;
            }
            if (qrNote) {
                if (isLoopbackUrl(shareUrl)) {
                    qrNote.textContent = 'This URL is localhost-only. Restart molbo with --host or --base-url to open it on another device.';
                    qrNote.classList.add('visible');
                } else {
                    qrNote.textContent = '';
                    qrNote.classList.remove('visible');
                }
            }
        }

        function showQrModal() {
            var modal = document.getElementById('qr-modal');
            var qrButton = document.getElementById('qr-button');
            var qrClose = document.getElementById('qr-close');
            if (!modal) {
                return;
            }
            updateQrModalContent();
            modal.classList.add('visible');
            modal.setAttribute('aria-hidden', 'false');
            if (qrButton) {
                qrButton.setAttribute('aria-expanded', 'true');
            }
            if (qrClose) {
                qrClose.focus();
            }
        }

        function hideQrModal() {
            var modal = document.getElementById('qr-modal');
            var qrButton = document.getElementById('qr-button');
            if (!modal || !modal.classList.contains('visible')) {
                return;
            }
            modal.classList.remove('visible');
            modal.setAttribute('aria-hidden', 'true');
            if (qrButton) {
                qrButton.setAttribute('aria-expanded', 'false');
                qrButton.focus();
            }
        }

        function copyShareUrl() {
            var shareUrl = currentShareUrl();
            var copyButton = document.getElementById('qr-copy');
            var qrUrl = document.getElementById('qr-url');
            var markCopied = function () {
                if (!copyButton) {
                    return;
                }
                copyButton.textContent = 'Copied';
                setTimeout(function () {
                    copyButton.textContent = 'Copy';
                }, 1500);
            };
            if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
                navigator.clipboard.writeText(shareUrl).then(markCopied).catch(function () {
                    if (qrUrl) {
                        qrUrl.select();
                    }
                });
                return;
            }
            if (qrUrl) {
                qrUrl.select();
                try {
                    document.execCommand('copy');
                    markCopied();
                } catch (_err) {}
            }
        }

        function showError(err) {
            var errorEl = document.getElementById('error');
            var errorMsg = document.getElementById('error-msg');
            if (!errorEl || !errorMsg) {
                return;
            }
            var detail = err && err.message ? err.message : String(err);
            errorMsg.textContent = 'Failed to load structure: ' + detail;
            errorEl.classList.add('visible');
        }

        function clearError() {
            var errorEl = document.getElementById('error');
            if (errorEl) {
                errorEl.classList.remove('visible');
            }
        }

        async function loadStructureIntoViewer(viewer, versionToken, forceRefresh) {
            var fmt = FORMAT_MAP[FORMAT_KEY] || 'mmcif';
            var isBinary = FORMAT_KEY === 'bcif';
            var url = FILE_URL;
            if (versionToken) {
                url = withQueryParam(url, 'v', versionToken);
            }
            if (forceRefresh) {
                url = withQueryParam(url, 'refresh', '1');
            }
            await viewer.loadStructureFromUrl(url, fmt, isBinary, { label: STRUCTURE_NAME });
            applyPublicationLook(viewer);
        }

        async function reloadStructure(options) {
            if (!activeViewer) {
                return;
            }
            var forceRefresh = Boolean(options && options.forceRefresh);
            if (reloadInFlight) {
                pendingReload = true;
                pendingForceRefresh = pendingForceRefresh || forceRefresh;
                return;
            }
            reloadInFlight = true;
            var reloadButton = document.getElementById('reload-button');
            if (reloadButton) {
                reloadButton.classList.add('spinning');
            }

            try {
                var cameraSnapshot = activeViewer.plugin.canvas3d
                    ? activeViewer.plugin.canvas3d.camera.getSnapshot()
                    : null;
                await activeViewer.plugin.clear(false);
                await loadStructureIntoViewer(activeViewer, String(Date.now()), forceRefresh);
                if (cameraSnapshot && activeViewer.plugin.canvas3d) {
                    activeViewer.plugin.canvas3d.camera.setState(cameraSnapshot, 0);
                }
                clearError();
            } catch (err) {
                showError(err);
                console.error(err);
            } finally {
                reloadInFlight = false;
                if (reloadButton) {
                    reloadButton.classList.remove('spinning');
                }
                if (pendingReload) {
                    var nextForce = pendingForceRefresh;
                    pendingReload = false;
                    pendingForceRefresh = false;
                    reloadStructure({ forceRefresh: nextForce });
                }
            }
        }

        function startFileWatcher() {
            var watchDot = document.getElementById('watch-dot');
            var reloadButton = document.getElementById('reload-button');
            if (watchDot) {
                watchDot.classList.add('active');
            }
            if (reloadButton) {
                reloadButton.setAttribute('title', 'Reload structure (watching for changes)');
            }

            var lastVersion = null;
            var debounceTimer = null;

            var checkVersion = function () {
                if (document.visibilityState === 'hidden') {
                    return;
                }
                fetch(VERSION_URL, { cache: 'no-store' })
                    .then(function (resp) {
                        return resp.ok ? resp.json() : null;
                    })
                    .then(function (data) {
                        if (!data || !data.version) {
                            return;
                        }
                        if (lastVersion === null) {
                            lastVersion = data.version;
                            return;
                        }
                        if (data.version !== lastVersion) {
                            lastVersion = data.version;
                            if (debounceTimer) {
                                clearTimeout(debounceTimer);
                            }
                            debounceTimer = setTimeout(function () {
                                reloadStructure({ forceRefresh: false });
                            }, 150);
                        }
                    })
                    .catch(function () {});
            };

            checkVersion();
            setInterval(checkVersion, 1000);
            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') {
                    checkVersion();
                }
            });
        }

        function bindControls() {
            var qrButton = document.getElementById('qr-button');
            var qrClose = document.getElementById('qr-close');
            var qrCopy = document.getElementById('qr-copy');
            var qrIncludeView = document.getElementById('qr-include-view');
            var modal = document.getElementById('qr-modal');
            var reloadButton = document.getElementById('reload-button');

            if (reloadButton) {
                reloadButton.addEventListener('click', function () {
                    reloadStructure({ forceRefresh: true });
                });
            }
            if (qrButton) {
                qrButton.addEventListener('click', showQrModal);
            }
            if (qrClose) {
                qrClose.addEventListener('click', hideQrModal);
            }
            if (qrCopy) {
                qrCopy.addEventListener('click', copyShareUrl);
            }
            if (qrIncludeView) {
                qrIncludeView.addEventListener('change', updateQrModalContent);
            }
            if (modal) {
                modal.addEventListener('click', function (event) {
                    if (event.target === modal) {
                        hideQrModal();
                    }
                });
            }
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape') {
                    hideQrModal();
                }
            });
            window.addEventListener('hashchange', function () {
                applyCameraFromHash(activeViewer);
            });
        }

        async function init() {
            var loadingEl = document.getElementById('loading');

            try {
                var viewer = await molstar.Viewer.create('viewer', {
                    layoutIsExpanded: false,
                    layoutShowControls: true,
                    layoutShowRemoteState: false,
                    layoutShowSequence: true,
                    layoutShowLog: false,
                    viewportShowExpand: false,
                    viewportShowSelectionMode: true,
                    layoutShowLeftPanel: true,
                    collapseLeftPanel: true,
                });

                activeViewer = viewer;
                window.molbo.viewer = viewer;
                await loadStructureIntoViewer(viewer, null, false);
                applyCameraFromHash(viewer);
                loadingEl.classList.add('hidden');
                if (WATCH_ENABLED) {
                    startFileWatcher();
                }
                if (readyResolve) {
                    readyResolve(window.molbo);
                }
            } catch (err) {
                loadingEl.classList.add('hidden');
                showError(err);
                console.error(err);
                if (readyReject) {
                    readyReject(err);
                }
            }
        }

        window.molbo = {
            ready: readyPromise,
            viewer: null,
            name: STRUCTURE_NAME,
            format: FORMAT_KEY,
            reload: function (options) {
                return reloadStructure(options);
            },
            getCameraHash: function () {
                if (!activeViewer || !activeViewer.plugin.canvas3d) {
                    return '';
                }
                return encodeCameraHash(activeViewer.plugin.canvas3d.camera.getSnapshot());
            },
            setCameraHash: function (hash) {
                var snapshot = decodeCameraHash(hash);
                if (!snapshot || !activeViewer || !activeViewer.plugin.canvas3d) {
                    return false;
                }
                activeViewer.plugin.canvas3d.camera.setState(snapshot, 0);
                return true;
            },
            getShareUrl: function (includeView) {
                var base = currentBaseShareUrl();
                if (includeView) {
                    var hash = window.molbo.getCameraHash();
                    if (hash) {
                        return base.split('#')[0] + hash;
                    }
                }
                return base;
            },
        };

        bindControls();
        init();

        if (AUTO_CLOSE) {
            var CLIENT_ID = createClientId();
            var CLIENT_HEARTBEAT_URL = withQueryParam(HEARTBEAT_URL, 'client', CLIENT_ID);
            var CLIENT_BYE_URL = withQueryParam(BYE_URL, 'client', CLIENT_ID);
            var byeSent = false;

            var sendHeartbeat = function () {
                fetch(CLIENT_HEARTBEAT_URL, { cache: 'no-store' }).catch(function () {});
            };

            var sendBye = function () {
                if (byeSent) {
                    return;
                }
                byeSent = true;
                if (navigator.sendBeacon) {
                    navigator.sendBeacon(CLIENT_BYE_URL);
                } else {
                    fetch(CLIENT_BYE_URL, { method: 'POST', keepalive: true }).catch(function () {});
                }
            };

            sendHeartbeat();
            setInterval(sendHeartbeat, HEARTBEAT_INTERVAL_MS);

            document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') {
                    byeSent = false;
                    sendHeartbeat();
                }
            });
            window.addEventListener('pageshow', function () {
                byeSent = false;
                sendHeartbeat();
            });
            window.addEventListener('pagehide', sendBye);
        }
    </script>
</body>
</html>
